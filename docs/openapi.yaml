openapi: 3.0.3
info:
  title: Network IDS SOC Copilot API
  version: 1.0.0
paths:
  /health:
    get:
      responses: { '200': { description: Healthy } }
  /:
    get:
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: Alert search and grounded explanation } }
  /ingest:
    get:
      responses: { '200': { description: Ingested normalized events } }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: x-api-key }
